[project]
name = "mod-watcher-agent"
version = "0.1.1"
description = "Mod Watcher Agent Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "selectolax>=0.3.27",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.0",
    "alembic>=1.13.1",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.36.0",
    "httpx>=0.27.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
