name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Build Windows desktop artifacts
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend and desktop dependencies
        shell: pwsh
        run: python -m pip install -e ".\backend[dev,desktop,packaging]"

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: Validate tag version
        shell: pwsh
        run: |
          $versionLine = Select-String `
            -LiteralPath "backend\pyproject.toml" `
            -Pattern '^\s*version\s*=\s*"([^"]+)"\s*$' |
            Select-Object -First 1
          if ($null -eq $versionLine) {
            throw "Unable to read project version"
          }
          $projectVersion = $versionLine.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$projectVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$projectVersion"
          }
          "PROJECT_VERSION=$projectVersion" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Install verified Inno Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadRoot = Join-Path $env:RUNNER_TEMP "inno-download"
          $innoRoot = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null
          gh release download "is-6_7_3" `
            --repo "jrsoftware/issrc" `
            --pattern "innosetup-6.7.3.exe" `
            --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $installer = Join-Path $downloadRoot "innosetup-6.7.3.exe"
          gh release verify-asset "is-6_7_3" $installer --repo "jrsoftware/issrc"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw "Inno Setup Authenticode verification failed: $($signature.Status)"
          }
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/CURRENTUSER",
            "/DIR=`"$innoRoot`""
          )
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)"
          }
          $isccPath = Join-Path $innoRoot "ISCC.exe"
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "Verified Inno Setup installation did not produce ISCC.exe"
          }
          "ISCC_PATH=$isccPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Run backend tests
        shell: pwsh
        run: python -m pytest backend -q

      - name: Run backend lint
        shell: pwsh
        run: python -m ruff check backend

      - name: Run frontend typecheck
        working-directory: frontend
        shell: pwsh
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        shell: pwsh
        run: npm test

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: npm run build

      - name: Build desktop, portable, and installer artifacts
        shell: pwsh
        run: |
          .\scripts\build_desktop.ps1 `
            -PythonExecutable (Get-Command python.exe).Source `
            -IsccPath $env:ISCC_PATH `
            -SkipTests `
            -SkipFrontendBuild `
            -SkipSmokeTest

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          .\scripts\smoke_test_desktop.ps1 `
            -ExecutablePath ".\dist-desktop\ModWatcherAgent\ModWatcherAgent.exe"

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $releaseRoot = [System.IO.Path]::GetFullPath((Join-Path $PWD "release")).TrimEnd("\", "/")
          $artifactPaths = @(
            (Join-Path $releaseRoot "ModWatcherAgent-$env:PROJECT_VERSION-win-x64-portable.zip"),
            (Join-Path $releaseRoot "ModWatcherAgent-Setup-$env:PROJECT_VERSION-win-x64.exe")
          )
          $expectedReleaseNames = @(
            "ModWatcherAgent-$env:PROJECT_VERSION-win-x64-portable.zip",
            "ModWatcherAgent-$env:PROJECT_VERSION-win-x64-portable.zip.sha256",
            "ModWatcherAgent-Setup-$env:PROJECT_VERSION-win-x64.exe",
            "ModWatcherAgent-Setup-$env:PROJECT_VERSION-win-x64.exe.sha256"
          ) | Sort-Object
          $actualReleaseNames = @(
            Get-ChildItem -LiteralPath $releaseRoot -Force |
              ForEach-Object { $_.Name } |
              Sort-Object
          )
          $releaseDifferences = @(
            Compare-Object -ReferenceObject $expectedReleaseNames -DifferenceObject $actualReleaseNames
          )
          if ($releaseDifferences.Count -ne 0) {
            throw "Release directory must contain exactly the four expected artifacts: $($releaseDifferences | Out-String)"
          }
          foreach ($artifactPath in $artifactPaths) {
            $fullArtifactPath = [System.IO.Path]::GetFullPath($artifactPath)
            if ([System.IO.Path]::GetDirectoryName($fullArtifactPath) -ne $releaseRoot) {
              throw "Release artifact escaped controlled output directory: $fullArtifactPath"
            }
            if (-not (Test-Path -LiteralPath $fullArtifactPath -PathType Leaf)) {
              throw "Missing release artifact: $fullArtifactPath"
            }
            $hashPath = [System.IO.Path]::GetFullPath("$fullArtifactPath.sha256")
            if ([System.IO.Path]::GetDirectoryName($hashPath) -ne $releaseRoot -or
                -not (Test-Path -LiteralPath $hashPath -PathType Leaf)) {
              throw "Missing or uncontrolled release checksum: $hashPath"
            }
            $hashLine = (Get-Content -LiteralPath $hashPath -Raw).Trim()
            if ($hashLine -notmatch '^([0-9a-f]{64})  ([^\\/]+)$') {
              throw "Malformed SHA256 file: $hashPath"
            }
            if ($Matches[2] -ne [System.IO.Path]::GetFileName($fullArtifactPath)) {
              throw "SHA256 filename does not match artifact: $hashPath"
            }
            $actualHash = (Get-FileHash -LiteralPath $fullArtifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $Matches[1]) {
              throw "SHA256 mismatch for $fullArtifactPath"
            }
          }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mod-watcher-agent-windows-x64
          path: |
            release/ModWatcherAgent-*-win-x64-portable.zip
            release/ModWatcherAgent-*-win-x64-portable.zip.sha256
            release/ModWatcherAgent-Setup-*-win-x64.exe
            release/ModWatcherAgent-Setup-*-win-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Publish tag release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download verified artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mod-watcher-agent-windows-x64
          path: release

      - name: Reverify exact downloaded artifact set and SHA256 files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected_assets=(
            "ModWatcherAgent-$version-win-x64-portable.zip"
            "ModWatcherAgent-$version-win-x64-portable.zip.sha256"
            "ModWatcherAgent-Setup-$version-win-x64.exe"
            "ModWatcherAgent-Setup-$version-win-x64.exe.sha256"
          )
          mapfile -t actual_assets < <(find release -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t expected_assets_sorted < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if ! diff -u \
            <(printf '%s\n' "${expected_assets_sorted[@]}") \
            <(printf '%s\n' "${actual_assets[@]}"); then
            echo "Downloaded artifact set does not match the expected four files." >&2
            exit 1
          fi
          for checksum in release/*.sha256; do
            artifact="${checksum%.sha256}"
            expected_name="$(basename "$artifact")"
            hash_line="$(tr -d '\r' < "$checksum")"
            digest="${hash_line%%  *}"
            referenced_name="${hash_line#*  }"
            if [[ "$digest" == "$hash_line" ||
                  ! "$digest" =~ ^[0-9a-f]{64}$ ||
                  "$referenced_name" != "$expected_name" ]]; then
              echo "Checksum file does not reference its matching artifact: $checksum" >&2
              exit 1
            fi
            (
              cd release
              printf '%s  %s\n' "$digest" "$referenced_name" |
                sha256sum --check --strict -
            )
          done

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/publish_desktop_release.sh \
            "$GITHUB_REF_NAME" \
            docs/desktop-release-notes.md \
            release
