version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "7500:7500"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/mod_watcher.db
    volumes:
      - backend_data:/app/data
      - backend_log:/app/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:7500/')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "7501:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
  backend_log:
